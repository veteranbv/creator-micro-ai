name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Profile, privacy, review policy and platform tests
        run: bash scripts/test.sh
  quality:
    if: always()
    needs: [tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success
