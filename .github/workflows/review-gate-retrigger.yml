name: review-gate-retrigger

# Re-evaluates the required `review-gate` check when Codex submits, edits, or
# dismisses a review, or when one of its inline finding comments is edited or
# deleted. Instead of running the gate directly (which
# would create a second check suite on the head SHA ; any non-success
# conclusion there blocks required-status evaluation; see review-gate.yml),
# this re-runs the existing pull_request-event gate job IN PLACE. A re-run is
# a new attempt of the same check suite, so it replaces the stale conclusion
# rather than competing with it.
#
# This workflow is NOT a required check, so its own conclusions (including
# cancellations from the concurrency group below) can never block a merge.
#
# `pull_request_review_comment` matters because Codex's blocking markers live
# in review-thread comments, not review bodies: editing or deleting an inline
# finding emits only this event, and without it the gate would keep a stale
# verdict until an unrelated rerun.
#
# Fork PRs: review and review-comment events from fork heads arrive with a
# read-only GITHUB_TOKEN (GitHub downgrades it even though the workflow runs
# in the base repository), so they cannot re-run the gate. The owner's
# exact-head `@codex review` comment is the supported recovery path for a
# delayed review on a fork PR ; issue_comment events are always privileged.

on:
  # Trusted base-branch code only; this workflow never checks out PR code.
  pull_request_target:
    types: [reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [edited, deleted]
  issue_comment:
    types: [created, edited, deleted]

# Later review events supersede earlier ones: the gate re-run fetches live PR
# state, so the surviving retrigger's re-run covers every review up to that
# point. Cancelled retrigger runs are harmless (not a required check).
concurrency:
  group: review-gate-retrigger-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  actions: write
  pull-requests: read

jobs:
  retrigger:
    # Bot reviews, Codex clean comments, edits to Codex's inline findings,
    # and exact-head owner review requests can change the gate's verdict.
    #
    # The review and review-comment paths are guarded to same-repo heads:
    # although these events always run in the BASE repository, GitHub
    # downgrades GITHUB_TOKEN to read-only when the triggering activity
    # comes from a public fork, so the job rerun POST would 403. Fork PRs
    # recover through the owner's exact-head `@codex review` comment below ;
    # `issue_comment` runs fully privileged regardless of where the PR head
    # lives, and the gate requires that owner request anyway.
    if: >-
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'pull_request_review'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.review.user.login == 'chatgpt-codex-connector[bot]'
      )
      || (
        github.event_name == 'pull_request_review_comment'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == github.repository_owner
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-run the review-gate job for this head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPO_OWNER: ${{ github.repository_owner }}
        # Decision table for the gate run's status at event time:
        #   completed   -> re-run: its verdict may predate this review.
        #   queued      -> skip: it hasn't fetched PR state yet, so its run
        #                  will include this review.
        #   in_progress -> ambiguous. If it's mid-poll, every later fetch
        #                  includes this review (the gate evaluates live
        #                  state), so a re-run is redundant. If it's already
        #                  past its final fetch, it finishes within seconds.
        #                  A short grace poll separates the two: completion
        #                  within ~2 min means it may have raced -> re-run;
        #                  still running after that means mid-poll -> skip.
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "issue_comment" ]; then
            pr_json=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            HEAD_SHA=$(jq -r '.head.sha' <<<"${pr_json}")
            export HEAD_SHA
            # Edits and deletions can revoke an earlier request or review.
            if [ "${COMMENT_AUTHOR}" = "${REPO_OWNER}" ] && [ "${EVENT_ACTION}" = "created" ]; then
              # Match the standalone command used by review_gate.py. Prose that
              # mentions this SHA must not authorize a request for another head.
              if ! python3 - <<'PYTHON'
          import os
          import re
          import sys
          command = re.compile(r"^[ \t]*@codex[ \t]+review[ \t]+([0-9a-f]{40})[ \t]*\r?$", re.IGNORECASE | re.MULTILINE)
          matches = command.finditer(os.environ["COMMENT_BODY"])
          sys.exit(0 if any(m.group(1).lower() == os.environ["HEAD_SHA"].lower() for m in matches) else 1)
          PYTHON
              then
                echo "Owner review request does not name the exact current head; skipping."
                exit 0
              fi
            fi
          fi

          # A SHA can belong to multiple PRs; rerun only this PR's gate.
          deadline=$(( SECONDS + 150 ))
          while :; do
            # Retry transient API failures within the grace period.
            # Fail visibly if the API never recovers.
            if ! run_json=$(gh api \
              "repos/${REPO}/actions/workflows/review-gate.yml/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" --paginate --slurp \
              | jq --argjson pr "${PR_NUMBER}" '[.[].workflow_runs[] | select(any(.pull_requests[]; .number == $pr))] | max_by(.created_at)'); then
              if [ "${SECONDS}" -ge "${deadline}" ]; then
                echo "Could not list review-gate runs within the grace period." >&2
                exit 1
              fi
              echo "API error listing review-gate runs; rechecking in 15s..."
              sleep 15
              continue
            fi
            if [ -z "${run_json}" ] || [ "${run_json}" = "null" ]; then
              echo "No review-gate run exists for ${HEAD_SHA}; nothing to retrigger."
              exit 0
            fi
            run_id=$(jq -r '.id' <<<"${run_json}")
            run_status=$(jq -r '.status' <<<"${run_json}")
            case "${run_status}" in
              completed)
                break
                ;;
              queued|waiting|pending|requested)
                echo "Run ${run_id} is ${run_status}; it will see this review once it starts."
                exit 0
                ;;
            esac
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Run ${run_id} still in progress after grace period; its poll loop sees this review."
              exit 0
            fi
            echo "Run ${run_id} is ${run_status}; rechecking in 15s..."
            sleep 15
          done

          # Replace only the existing gate verdict for this head.
          job_id=$(gh api "repos/${REPO}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[] | select(.name == "review-gate")][0].id')
          if [ -z "${job_id}" ] || [ "${job_id}" = "null" ]; then
            echo "review-gate job not found in run ${run_id}" >&2
            exit 1
          fi
          echo "Re-running review-gate job ${job_id} (run ${run_id}) to evaluate this review."
          gh api -X POST "repos/${REPO}/actions/jobs/${job_id}/rerun"
